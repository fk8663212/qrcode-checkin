<section id="raffle-animation" class="raffle-animation" aria-label="{{ tr('抽獎揭曉') }}" hidden>
  <div class="raffle-halo" aria-hidden="true"></div>
  <div class="raffle-sparkles" aria-hidden="true">✦ <span>✧</span> ✦ <span>✧</span> ✦</div>
  <p id="animation-prize" class="eyebrow"></p>
  <h2 id="animation-title">{{ tr('幸運得主即將揭曉') }}</h2>
  <div id="raffle-reels" class="raffle-reels" aria-hidden="true"><span class="reel-prefix">P</span><span class="reel-digit">0</span><span class="reel-digit">0</span><span class="reel-digit">0</span></div>
  <div id="animation-winners" class="animation-winners" hidden></div>
  <p id="animation-hint" class="muted" role="status"></p>
  <div class="raffle-confetti" aria-hidden="true">{% for i in range(16) %}<i style="--i:{{ i }}"></i>{% endfor %}</div>
</section>
